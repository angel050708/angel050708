<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Angel Solano</title>
  <desc id="d">Computer engineer. ERP, data and web. A ledger reconciles to a zero balance.</desc>

  <defs>
    <radialGradient id="glow" cx="88%" cy="0%" r="70%">
      <stop offset="0" stop-color="#e0a458" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rules" width="10" height="28" patternUnits="userSpaceOnUse">
      <rect width="10" height="1" y="27" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    .mono  { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, Menlo, monospace; }
    .serif { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }

    .row, .bal, .cur { opacity: 0; }
    .row, .bal {
      transform: translateY(6px);
      animation: rise 520ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    .r1 { animation-delay: 300ms; }
    .r2 { animation-delay: 460ms; }
    .r3 { animation-delay: 620ms; }
    .bal { animation-delay: 1000ms; }
    .cur { animation: blink 1.1s steps(1, end) 1.6s infinite; }

    @keyframes rise  { to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .row, .bal { animation: none; opacity: 1; transform: none; }
      .cur { animation: none; opacity: 0; }
    }
  </style>

  <!-- surface -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="#0b0f14" stroke="#1c242d"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="url(#rules)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="url(#glow)"/>

  <!-- left: identity -->
  <text class="mono" x="56" y="82" font-size="12" letter-spacing="3.5" fill="#e0a458">ERP · DATA · WEB</text>
  <text class="serif" x="54" y="160" font-size="68" fill="#ece7da" letter-spacing="-1">Angel Solano</text>
  <text class="mono" x="56" y="204" font-size="16" fill="#8b97a3">Computer engineer. I make the numbers match.</text>
  <rect x="56" y="230" width="44" height="2" fill="#e0a458"/>
  <text class="mono" x="56" y="266" font-size="13" fill="#5d6975">Business Central · SQL Server · Next.js</text>

  <!-- right: ledger -->
  <g class="mono">
    <text x="760" y="82" font-size="11" letter-spacing="2.5" fill="#5d6975">LEDGER / RECONCILIATION</text>
    <rect x="760" y="94" width="384" height="1" fill="#1f2a35"/>

    <g class="row r1">
      <text x="760" y="128" font-size="15" fill="#aab4be">INV-0412</text>
      <text x="1088" y="128" font-size="15" fill="#ece7da" text-anchor="end">+12,450.00</text>
      <text x="1112" y="128" font-size="14" fill="#7fd1a8">✓</text>
    </g>
    <g class="row r2">
      <text x="760" y="160" font-size="15" fill="#aab4be">INV-0413</text>
      <text x="1088" y="160" font-size="15" fill="#ece7da" text-anchor="end">−3,180.50</text>
      <text x="1112" y="160" font-size="14" fill="#7fd1a8">✓</text>
    </g>
    <g class="row r3">
      <text x="760" y="192" font-size="15" fill="#aab4be">PMT-0097</text>
      <text x="1088" y="192" font-size="15" fill="#ece7da" text-anchor="end">−9,269.50</text>
      <text x="1112" y="192" font-size="14" fill="#7fd1a8">✓</text>
    </g>

    <rect x="760" y="214" width="384" height="1" fill="#1f2a35"/>

    <g class="bal">
      <text x="760" y="252" font-size="12" letter-spacing="2.5" fill="#5d6975">BALANCE</text>
      <text x="1088" y="252" font-size="20" fill="#7fd1a8" text-anchor="end">0.00</text>
    </g>
    <rect class="cur" x="1096" y="237" width="9" height="19" fill="#7fd1a8"/>
  </g>
</svg>
